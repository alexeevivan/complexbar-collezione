<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>SportFX · Bebas Neue variant</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&display=swap"
		rel="stylesheet">

	<style>
		:root {
			--bg: #0a0f1c;
			--text: #ffffff;
			--font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

			/* === EDITABLE TIER COLORS (CORE) === */
			--accent: #2D7FF9;
			--accent2: #4A93FF;
			--glow: rgba(45, 127, 249, 0.55);
			--ring: #2D7FF9;
			--foil: linear-gradient(115deg, #2D7FF9 0%, #5AD1FF 30%, #ffffff 45%, #3FE3A4 60%, #2D7FF9 100%);
			--holo: 0.6;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			height: 100%;
		}

		body {
			background:
				radial-gradient(1100px 800px at 50% 18%, rgba(45, 127, 249, 0.10), transparent 60%),
				radial-gradient(900px 700px at 50% 100%, rgba(63, 227, 164, 0.05), transparent 60%),
				var(--bg);
			color: var(--text);
			font-family: var(--font);
			min-height: 100dvh;
			display: grid;
			place-items: center;
			padding: 40px 20px;
			overflow-x: hidden;
		}

		/* ===== Card wrapper / perspective ===== */
		.fxwrap {
			perspective: 1400px;
			width: 430px;
			height: 602px;
			max-width: 92vw;
			touch-action: none;
		}

		.fxcard {
			position: relative;
			width: 100%;
			height: 100%;
			border-radius: 26px;
			transform-style: preserve-3d;
			transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
			transition: box-shadow 0.3s ease;
			background: linear-gradient(160deg, #141b2c, #0a0f1c 60%);
			box-shadow:
				0 30px 70px rgba(0, 0, 0, 0.6),
				0 0 0 1px rgba(255, 255, 255, 0.06);
			--mx: 50%;
			--my: 50%;
		}

		.fxcard.is-active {
			box-shadow:
				0 50px 110px rgba(0, 0, 0, 0.7),
				0 0 60px -10px var(--glow),
				0 0 0 1px rgba(255, 255, 255, 0.10);
		}

		/* glow halo */
		.fx-halo {
			position: absolute;
			inset: -2px;
			border-radius: 28px;
			background: var(--ring);
			opacity: 0;
			filter: blur(26px);
			transition: opacity 0.3s ease;
			z-index: -1;
		}

		.fxcard.is-active .fx-halo {
			opacity: 0.45;
		}

		/* photo zone */
		.fx-photo {
			position: absolute;
			inset: 0;
			border-radius: 26px;
			overflow: hidden;
		}

		.fx-photo-bg {
			position: absolute;
			inset: 0;
			background:
				radial-gradient(120% 80% at 50% 12%, color-mix(in srgb, var(--accent) 38%, #0a0f1c), #0a0f1c 70%);
		}

		.fx-photo-img {
			position: absolute;
			inset: 0;
			z-index: 1;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center 15%;
		}

		.fx-photo-placeholder {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 5px;
			color: rgba(0, 0, 0, 0.55);
			font-size: 12px;
			font-weight: 500;
		}

		.fx-photo-placeholder svg {
			opacity: 0.45;
		}

		.fx-photo-fade {
			position: absolute;
			inset: 0;
			z-index: 2;
			background:
				linear-gradient(180deg, rgba(10, 15, 28, 0.45) 0%, transparent 24%, transparent 50%, rgba(10, 15, 28, 0.82) 86%, rgba(10, 15, 28, 0.96) 100%);
			pointer-events: none;
		}

		/* ===== Holographic foil ===== */
		.fx-foil {
			position: absolute;
			inset: 0;
			border-radius: 26px;
			background: var(--foil);
			background-size: 340% 340%;
			background-position: var(--mx) var(--my);
			mix-blend-mode: color-dodge;
			opacity: calc(0.32 * var(--holo, 1));
			pointer-events: none;
			z-index: 3;
			-webkit-mask-image: repeating-linear-gradient(115deg,
					rgba(0, 0, 0, 0.55) 0px, rgba(0, 0, 0, 0.9) 3px, rgba(0, 0, 0, 0.4) 7px, rgba(0, 0, 0, 0.85) 11px);
			mask-image: repeating-linear-gradient(115deg,
					rgba(0, 0, 0, 0.55) 0px, rgba(0, 0, 0, 0.9) 3px, rgba(0, 0, 0, 0.4) 7px, rgba(0, 0, 0, 0.85) 11px);
		}

		.fx-foil-2 {
			mix-blend-mode: soft-light;
			opacity: calc(0.5 * var(--holo, 1));
			background-size: 220% 220%;
			-webkit-mask-image: none;
			mask-image: none;
			filter: saturate(1.5);
		}

		/* sparkle field */
		.fx-sparkle {
			position: absolute;
			inset: 0;
			border-radius: 26px;
			z-index: 4;
			pointer-events: none;
			opacity: calc(0.5 * var(--holo, 1));
			background-image:
				radial-gradient(1.4px 1.4px at 18% 22%, rgba(255, 255, 255, 0.9), transparent 60%),
				radial-gradient(1.2px 1.2px at 72% 16%, rgba(255, 255, 255, 0.8), transparent 60%),
				radial-gradient(1.6px 1.6px at 40% 38%, rgba(255, 255, 255, 0.7), transparent 60%),
				radial-gradient(1.1px 1.1px at 86% 44%, rgba(255, 255, 255, 0.85), transparent 60%),
				radial-gradient(1.3px 1.3px at 28% 60%, rgba(255, 255, 255, 0.7), transparent 60%),
				radial-gradient(1.5px 1.5px at 62% 70%, rgba(255, 255, 255, 0.8), transparent 60%),
				radial-gradient(1.2px 1.2px at 12% 80%, rgba(255, 255, 255, 0.7), transparent 60%),
				radial-gradient(1.4px 1.4px at 90% 78%, rgba(255, 255, 255, 0.75), transparent 60%);
			mix-blend-mode: screen;
			-webkit-mask-image: radial-gradient(120% 120% at var(--mx) var(--my), #000 0%, rgba(0, 0, 0, 0.25) 45%, transparent 75%);
			mask-image: radial-gradient(120% 120% at var(--mx) var(--my), #000 0%, rgba(0, 0, 0, 0.25) 45%, transparent 75%);
		}

		/* glare */
		.fx-glare {
			position: absolute;
			inset: 0;
			border-radius: 26px;
			z-index: 5;
			pointer-events: none;
			background: radial-gradient(circle at var(--mx) var(--my),
					rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.08) 18%, transparent 45%);
			mix-blend-mode: overlay;
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		.fxcard.is-active .fx-glare {
			opacity: 1;
		}

		/* inner frame (sin corner ticks como en tu Figma) */
		.fx-frame {
			position: absolute;
			inset: 10px;
			border-radius: 18px;
			z-index: 6;
			pointer-events: none;
			border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
			box-shadow:
				inset 0 0 0 5px rgba(10, 15, 28, 0.55),
				inset 0 0 24px 1px rgba(0, 0, 0, 0.45);
		}

		/* ===== Top row (tier badge + rating) ===== */
		.fx-top {
			position: absolute;
			top: 22px;
			left: 22px;
			right: 22px;
			z-index: 8;
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			transform: translateZ(40px);
		}

		.fx-tier {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			padding: 7px 13px 7px 10px;
			border-radius: 999px;
			background: rgba(10, 15, 28, 0.62);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.14em;
			color: #fff;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
		}

		.fx-rating {
			position: relative;
			width: 68px;
			height: 74px;
			display: grid;
			place-items: center;
			background: linear-gradient(148deg, var(--accent2), var(--accent));
			clip-path: polygon(50% 0%, 100% 26%, 100% 74%, 50% 100%, 0% 74%, 0% 26%);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), 0 0 22px -6px var(--glow);
			text-align: center;
			line-height: 1;
		}

		.fx-rating::before {
			content: "";
			position: absolute;
			inset: 2px;
			clip-path: polygon(50% 0%, 100% 26%, 100% 74%, 50% 100%, 0% 74%, 0% 26%);
			background: linear-gradient(148deg, rgba(255, 255, 255, 0.35), transparent 55%);
			pointer-events: none;
		}

		.fx-rating-num {
			font-size: 30px;
			font-weight: 900;
			color: #0a0f1c;
			font-family: "Inter", var(--font);
			letter-spacing: -0.03em;
			line-height: 0.82;
			margin-top: 7px;
			text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
		}

		.fx-rating-lbl {
			font-size: 10px;
			font-weight: 800;
			letter-spacing: 0.18em;
			color: rgba(10, 15, 28, 0.7);
			margin-top: -1px;
		}

		/* ===== Bottom row (name + classification) ===== */
		.fx-bottom {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			z-index: 8;
			padding: 0 26px 24px;
			transform: translateZ(36px);
		}

		.fx-name-row {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 14px;
		}

		.fx-name-block {
			min-width: 0;
		}

		.fx-firstname {
			font-size: 22px;
			font-weight: 400;
			letter-spacing: 0.04em;
			font-family: "Bebas Neue", var(--font);
			color: rgba(255, 255, 255, 0.82);
			line-height: 1;
			margin-bottom: 2px;
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
		}

		.fx-lastname {
			font-size: 68px;
			font-weight: 400;
			font-family: "Bebas Neue", var(--font);
			letter-spacing: 0.005em;
			line-height: 0.88;
			text-transform: uppercase;
			color: #ffffff;
			text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
		}

		.fx-handle {
			font-size: 12.5px;
			font-weight: 500;
			color: var(--accent2);
			margin-top: 8px;
			text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
		}

		/* Diamond-shaped position badge */
		.fx-pos {
			flex: 0 0 auto;
			padding-bottom: 4px;
		}

		.fx-pos-diamond {
			width: 57px;
			height: 57px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 3px;
			background: rgba(10, 15, 28, 0.66);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border: 1.5px solid color-mix(in srgb, var(--accent) 65%, transparent);
			transform: rotate(45deg);
			border-radius: 12px;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
		}

		.fx-pos-main {
			display: block;
			width: 100%;
			transform: rotate(-45deg);
			transform-origin: center;
			font-size: 16px;
			font-weight: 800;
			color: #fff;
			line-height: 1;
			text-align: center;
		}

		.fx-pos-sub {
			display: block;
			width: 100%;
			transform: rotate(-45deg);
			transform-origin: center;
			font-size: 9.5px;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-align: center;
			line-height: 1;
			color: var(--accent2);
		}

		/* Footer row: classification + meta + bolt logo button */
		.fx-foot {
			display: flex;
			align-items: flex-end;
			gap: 12px;
			padding-top: 13px;
			border-top: 1px solid rgba(255, 255, 255, 0.12);
		}

		.fx-class {
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.fx-class-lbl {
			font-size: 8.5px;
			font-weight: 700;
			letter-spacing: 0.16em;
			color: rgba(255, 255, 255, 0.42);
		}

		.fx-class-num {
			font-size: 14px;
			font-weight: 800;
			color: #fff;
			letter-spacing: -0.01em;
			line-height: 1;
		}

		.fx-meta {
			display: flex;
			align-items: baseline;
			gap: 6px;
			font-size: 12px;
			font-weight: 500;
			line-height: 1;
			color: rgba(255, 255, 255, 0.62);
			margin-left: 4px;
			padding-bottom: 2px;
		}

		.fx-meta .fx-dot {
			color: rgba(255, 255, 255, 0.3);
		}

		.fx-logo {
			margin-left: auto;
			width: 39px;
			height: 39px;
			border-radius: 11px;
			display: grid;
			place-items: center;
			background: linear-gradient(150deg, var(--accent2), var(--accent));
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), 0 0 18px -6px var(--glow);
		}

		/* Mobile sizing */
		@media (max-width: 480px) {
			.fxwrap {
				width: min(92vw, 430px);
				height: calc(min(92vw, 430px) * 1.4);
			}

			.fx-lastname {
				font-size: clamp(40px, 14vw, 60px);
			}
		}
	</style>
</head>

	<script>
		// === Holo tilt + foil tracking (mouse + touch via pointer events) ===
		(function () {
			const wrap = document.getElementById('fxwrap');
			const card = document.getElementById('fxcard');
			if (!wrap || !card) return;

			let raf = null;
			let target = { rx: 0, ry: 0, px: 50, py: 50 };
			let cur = { rx: 0, ry: 0, px: 50, py: 50 };

			function apply() {
				cur.rx += (target.rx - cur.rx) * 0.16;
				cur.ry += (target.ry - cur.ry) * 0.16;
				cur.px += (target.px - cur.px) * 0.16;
				cur.py += (target.py - cur.py) * 0.16;
				card.style.setProperty('--rx', cur.rx.toFixed(2) + 'deg');
				card.style.setProperty('--ry', cur.ry.toFixed(2) + 'deg');
				card.style.setProperty('--mx', cur.px.toFixed(2) + '%');
				card.style.setProperty('--my', cur.py.toFixed(2) + '%');
				if (
					Math.abs(target.rx - cur.rx) > 0.01 ||
					Math.abs(target.ry - cur.ry) > 0.01 ||
					Math.abs(target.px - cur.px) > 0.05 ||
					Math.abs(target.py - cur.py) > 0.05
				) {
					raf = requestAnimationFrame(apply);
				} else {
					raf = null;
				}
			}
			function kick() { if (!raf) raf = requestAnimationFrame(apply); }

			function onMove(e) {
				const r = wrap.getBoundingClientRect();
				const x = (e.clientX - r.left) / r.width;
				const y = (e.clientY - r.top) / r.height;
				const MAX = 14;
				target.ry = (x - 0.5) * 2 * MAX;
				target.rx = -(y - 0.5) * 2 * MAX;
				target.px = Math.max(0, Math.min(100, x * 100));
				target.py = Math.max(0, Math.min(100, y * 100));
				kick();
			}
			function onEnter() { card.classList.add('is-active'); }
			function onLeave() {
				card.classList.remove('is-active');
				target = { rx: 0, ry: 0, px: 50, py: 50 };
				kick();
			}

			// pointermove covers mouse + touch + pen
			wrap.addEventListener('pointermove', onMove);
			wrap.addEventListener('pointerenter', onEnter);
			wrap.addEventListener('pointerleave', onLeave);
			// also handle pointerdown on mobile so the holo activates on tap
			wrap.addEventListener('pointerdown', onEnter);
			wrap.addEventListener('pointerup', onLeave);
		})();
	</script>
