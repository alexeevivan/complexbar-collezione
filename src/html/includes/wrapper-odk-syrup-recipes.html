<div class="page">
	<header class="header recipes-header">
		<svg class="burger burger-rotate ham8" viewBox="0 0 100 100" width="80">
			<path class="line top"
				d="m 30,33 h 40 c 3.722839,0 7.5,3.126468 7.5,8.578427 0,5.451959 -2.727029,8.421573 -7.5,8.421573 h -20" />
			<path class="line middle" d="m 30,50 h 40" />
			<path class="line bottom"
				d="m 70,67 h -40 c 0,0 -7.5,-0.802118 -7.5,-8.365747 0,-7.563629 7.5,-8.634253 7.5,-8.634253 h 20" />
		</svg>
		<ul class="menu">
			<li class="menu-item">
				<a href="index.html" aria-label="Main page link">
					главная
				</a>
			</li>
			<li class="menu-item">
				<a href="expert-studio.html" aria-label="Studion page link">
					о студии
				</a>
			</li>
			<li class="menu-item">
				<a href="calendar.html" aria-label="Meetings page link">
					мероприятия
				</a>
			</li>
			<li class="menu-item">
				<a href="collaboration.html" aria-label="Collaboration page link">
					сотрудничество
				</a>
			</li>
		</ul>
		<ul class="header-container">
			<li class="header-container__item additional">
				<a href="index.html" aria-label="Main page link">
					главная
				</a>
			</li>
			<li class="header-container__item">
				<a href="expert-studio.html" aria-label="Studion page link">
					о студии
				</a>
			</li>
			<li class="header-container__item">
				<a href="calendar.html" aria-label="Meetings page link">
					мероприятия
				</a>
			</li>
			<li class="header-container__item">
				<a href="collaboration.html" aria-label="Collaboration page link">
					сотрудничество
				</a>
			</li>
		</ul>
	</header>
	<main class="main recipes-page">
		<section class="intro">
			<div class="top-divider">
				<span class="line"></span>
				<span class="dot"></span>
				<span class="line"></span>
			</div>

			<div class="into__badge">
				<h1 class="recipes-title">
					{{ pageTitle }}
				</h1>

				<div class="recipes-content">
					<p>
						{{ pageDescription }}
					</p>
				</div>
			</div>

			<div class="bottom-divider">
				<span class="line"></span>
				<span class="dot"></span>
				<span class="line"></span>
			</div>
		</section>

		<section class="card-container">
			<div class="card-container__search">
				<form role="search" data-recipe-search-form>
					<label for="site-search">
						Поиск по ингредиентам
					</label>
					<div class="card-container__search-control">
						<input type="search" id="site-search" name="q" placeholder="Введите название ингредиента..."
							autocomplete="off" data-recipe-search>
					</div>
				</form>
				<div class="card-container__search-suggestions">
					<button type="button" data-search-suggestion="пандан">
						пандан
					</button>
					<button type="button" data-search-suggestion="бобы тонка">
						бобы тонка
					</button>
					<button type="button" data-search-suggestion="lime premium sour">
						lime premium sour
					</button>
					<button type="button" data-search-suggestion="цветы бузины">
						цветы бузины
					</button>
					<button type="button" data-search-suggestion="фалернум">
						фалернум
					</button>
					<button type="button" data-search-suggestion="гибискус">
						гибискус
					</button>
				</div>
				<p class="card-container__search-status" aria-live="polite" data-recipe-search-status></p>
			</div>
			<div class="card-container__cocktails" data-reveal data-recipe-collection="{{ collectionId }}">
			</div>
		</section>
		<section class="modal">
			<dialog class="recipe-modal" data-recipe-modal aria-labelledby="recipe-modal-title">
				<article class="recipe-modal__content">
					<form method="dialog">
						<button class="recipe-modal__close" type="submit" aria-label="Закрыть" data-recipe-close>
							×
						</button>
					</form>
					<img data-recipe-image src="" alt="">
					<h2 id="recipe-modal-title" data-recipe-title></h2>
					<div class="recipe-modal__cocktail-data">
						<div class="recipe-modal__ingredients">
							<h3>
								Ингредиенты
							</h3>
							<ul data-recipe-ingredients></ul>
						</div>
						<div class="recipe-modal__method">
							<h3>
								Метод
							</h3>
							<p data-recipe-method></p>
						</div>
						<div class="recipe-modal__garnish">
							<h3>
								Украшение
							</h3>
							<p data-recipe-garnish></p>
						</div>
					</div>
				</article>
			</dialog>
		</section>
	</main>

	<include src="includes/footer.html"></include>
</div>
